<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta http-equiv="refresh" content="0; url=https://tuxhouse.eu/">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://tuxhouse.eu/">
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://tuxhouse.eu/">
  </noscript>
  <script>
    // Primary redirect without adding to history
    window.location.replace("https://tuxhouse.eu/");
    // Fallback
    setTimeout(function(){ window.location.href = "https://tuxhouse.eu/"; }, 0);
  </script>
</head>
<body>
  <p>Μεταφορά στο tuxhouse.eu… Αν δεν γίνει αυτόματα, πατήστε εδώ: <a href="https://tuxhouse.eu/">tuxhouse.eu</a></p>
</body>
</html>
